name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed to again. Runs on main are
# never cancelled — coverage there is the recorded baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Download dependencies
      run: go mod download

    - name: Run go vet
      run: go vet ./...

    - name: Run gofmt
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Please run 'gofmt -s -w .' to format your code"
          gofmt -s -l .
          exit 1
        fi

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.txt
        fail_ci_if_error: false

    - name: Check go.mod/go.sum are tidy
      run: make tidy-check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Resolve golangci-lint version
      id: golangci-lint
      run: echo "version=$(make print-golangci-lint-version)" >> "$GITHUB_OUTPUT"

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: ${{ steps.golangci-lint.outputs.version }}
        args: --timeout=5m

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Run govulncheck
      run: make vuln

  # THIS IS THE ONLY JOB THAT SHOULD BE A REQUIRED STATUS CHECK.
  #
  # Requiring the other jobs directly is brittle: if the test matrix ever
  # grows another entry, its check name changes and any branch protection
  # rule pointing at the old name silently orphans. Gating on one stable name
  # instead means the matrix is free to change.
  #
  # `if: always()` is load-bearing. Without it this job is skipped when a
  # dependency fails, and GitHub counts a skipped required check as passing —
  # a failing build would report mergeable.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [ test, lint, vuln ]
    steps:
      - name: Fail if any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::one or more CI jobs did not succeed"
          exit 1
      - name: All jobs succeeded
        run: echo "all jobs succeeded"
